# Use this workflow to make use of the central workflows from https://freekpols.github.io/JB-workflows/.github/workflows/
name: Deploy

on:
  push:
    branches: [main]
      
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  deploy:
    uses: FreekPols/JB-workflows/.github/workflows/menu.yml@main
    with:
      build_pdf: false
      execute_python: false
      run_nb_checks: false
      run_fig_checks: true
      run_code_checks: false

          # FreekPols/JB-workflows/.github/workflows/execute.yml@main           # Python execute, no pdf
          # FreekPols/JB-workflows/.github/workflows/pdf_workflow.yml@main      # pdf and execute